name: iOS

# Runs the SolarPulseKit tests and checks that the app compiles for the
# simulator (unsigned). Installing on an iPhone still needs Xcode signing.
# macOS runners use more Actions minutes, so this runs only when ios/ changes.
on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" && xcodebuild -version
      - name: SolarPulseKit tests
        working-directory: ios/SolarPulseKit
        run: swift test
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project SolarPulse.xcodeproj -scheme SolarPulse \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
